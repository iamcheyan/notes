<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>片语便签</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c0a87a'%3E%3Cpath d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/%3E%3C/svg%3E">
    <link rel="alternate icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAAdgAAAHYBTnsmCAAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAAAAMSURBVDiNY2AYBfQMgf///3P8+evTNNYBeCPQcIGGBCMCMCSWCAAQBCG28YVogAZorKg6FcSNAryBhRDQp6qVWWdcmFuc2Zvcm0UDABAxQHJA1fRrJAWVW4sgAAAABJRU5ErkJggg==">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .top-bar {
            height: 52px;
            background: linear-gradient(to bottom, #5a5a5a, #404040);
            display: flex;
            align-items: center;
            padding: 0 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        .logo {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            margin-right: 30px;
            letter-spacing: 0.5px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
        }

        .top-bar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .btn {
            width: 44px;
            height: 36px;
            border: 1px solid rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #666, #555);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 4px;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #777, #666);
        }

        .btn:active {
            background: linear-gradient(to bottom, #555, #444);
        }

        .btn.delete {
            border-color: rgba(200,0,0,0.3);
            background: linear-gradient(to bottom, #f55, #d33);
        }

        .btn.delete:hover {
            background: linear-gradient(to bottom, #f66, #e44);
        }

        /* SVG 按钮图标 */
        .btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* 主内容区 */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧列表区 */
        .left-panel {
            width: 300px;
            background-color: #f9f7f2;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .note-item {
            padding: 12px 18px;
            border-bottom: 1px solid #eae7e0;
            cursor: pointer;
            transition: background-color 0.15s;
            position: relative;
        }

        .note-item:hover {
            background-color: #f0ebe3;
        }

        .note-item.active {
            background-color: #eae5db;
        }

        .note-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .note-preview {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .note-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .star-icon {
            width: 16px;
            height: 16px;
            fill: #ccc;
            cursor: pointer;
            flex-shrink: 0;
        }

        .star-icon.favorited {
            fill: #ffd700;
        }

        .image-icon {
            width: 16px;
            height: 16px;
            fill: #999;
            flex-shrink: 0;
        }

        /* 右侧详情区 */
        .right-panel {
            flex: 1;
            background-color: #f9f7f2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-header {
            padding: 20px 28px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #f9f7f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-date {
            font-size: 13px;
            color: #777;
        }

        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #eae7e0;
            color: #666;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 12px;
        }

        .detail-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        .detail-content.empty {
            color: #aaa;
            font-style: normal;
        }

        /* 编辑模式 */
        .detail-content.editing {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            font-family: inherit;
        }

        .detail-content textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        /* 分享模式 - 右侧变成图片查看器 */
        .right-panel.share-mode .detail-header {
            display: none;
        }

        .right-panel.share-mode .bottom-bar {
            justify-content: space-between;
            gap: 4px;
        }

        .right-panel.share-mode .bottom-bar .share-action-btn {
            padding: 6px 14px;
            border: 1px solid #ccc;
            background: linear-gradient(to bottom, #f8f6f2, #f0ebe3);
            color: #333;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .right-panel.share-mode .bottom-bar .share-action-btn:hover {
            background: linear-gradient(to bottom, #fcfaf8, #f5f3ee);
            border-color: #bbb;
        }

        .right-panel.share-mode .bottom-bar .share-action-btn:active {
            background: linear-gradient(to bottom, #f0ebe3, #e8e6e0);
        }

        /* 图片查看器 */
        .share-viewer {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            background: #eae5db;
            background-image:
                radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(0,0,0,0.04) 0%, transparent 60%);
        }

        .share-viewer img {
            display: block;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
            border-radius: 4px;
            flex-shrink: 0;
        }

        .share-zoom-level {
            font-size: 12px;
            color: #666;
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* 右键菜单 */
        .context-menu {
            display: none;
            position: fixed;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 1000;
            min-width: 140px;
            padding: 4px 0;
        }

        .context-menu.show {
            display: block;
        }

        .context-menu-item {
            padding: 8px 16px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .context-menu-item:hover {
            background: #f0ebe3;
        }

        /* 便签卡片样式 - 用于图片渲染 */
        .share-card {
            background: #f7f3eb;
            border-radius: 2px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            padding: 48px 52px 40px;
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
            font-family: "Noto Serif SC", "Source Han Serif SC", STSong, "Songti SC", Georgia, serif;
            line-height: 2;
            color: #2c2c2c;
            position: relative;
        }

        .share-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0,0,0,.015) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0,0,0,.01) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255,255,255,.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            border-radius: 2px;
        }

        .share-card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 380px;
        }

        .share-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0,0,0,.12);
            margin-bottom: 24px;
            font-size: 13px;
            color: #999;
            letter-spacing: .5px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .share-card-date {
            color: #999;
        }

        .share-card-brand {
            color: #bbb;
            font-size: 13px;
        }

        .share-card-content-inner {
            flex: 1;
            font-size: 17px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            font-family: "Noto Serif SC", "Source Han Serif SC", STSong, "Songti SC", Georgia, serif;
            line-height: 2;
            color: #2c2c2c;
        }

        .share-card-footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,.08);
            text-align: center;
            font-size: 12px;
            color: #bbb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 1px;
        }

        .bottom-bar {
            height: 44px;
            background-color: #f9f7f2;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        /* 加载动画 */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.35);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            background: #fff;
            padding: 28px 40px;
            border-radius: 12px;
            font-size: 16px;
            color: #555;
            text-align: center;
        }

        .spinner::after {
            content: "";
            display: block;
            width: 32px;
            height: 32px;
            margin: 16px auto 0;
            border: 3px solid #e8e0d0;
            border-top-color: #c0a87a;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="logo">片语便签</div>
            <button class="btn" id="refreshBtn" title="刷新">
                <svg viewBox="0 0 24 24">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
            <button class="btn" id="newBtn" title="新建便签">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
        </div>
        <div class="top-bar-right">
            <button class="btn" id="shareBtn" title="分享为图片">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
            <button class="btn delete" id="deleteBtn" title="删除便签">
                <svg viewBox="0 0 24 24">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧列表 -->
        <div class="left-panel" id="leftPanel"></div>

        <!-- 右侧详情 -->
        <div class="right-panel" id="rightPanel">
            <div class="detail-header">
                <div class="detail-tags">
                    <span class="tag">无</span>
                </div>
                <div class="detail-date" id="detailDate"></div>
            </div>
            <div class="detail-content" id="detailContent"></div>
            <div class="bottom-bar">
                <span style="color: #777; font-size:13px; margin-right: auto;">全部便签</span>
                <svg style="width: 16px; height: 16px; fill: #888; margin-right: 8px;" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <svg style="width: 16px; height: 16px; fill: #999;" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- 隐藏的渲染卡片（用于 html2canvas 截图） -->
    <div style="position:fixed;left:-9999px;top:0;z-index:-1;opacity:0;pointer-events:none">
        <div class="share-card" id="shareCard">
            <div class="share-card-content">
                <div class="share-card-header">
                    <span class="share-card-date" id="shareDate"></span>
                    <span class="share-card-brand">片语</span>
                </div>
                <div class="share-card-content-inner" id="shareContent"></div>
                <div class="share-card-footer">— 片语便签 —</div>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="viewOriginalBtn">查看原图</div>
    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loadingOverlay">
        <div class="spinner">图片生成中…</div>
    </div>

    <script>
        // 状态变量
        let notes = [];
        let currentNote = null;
        let isEditing = false;
        let isNewNote = false;
        let isStaticMode = false;
        let toasterTimer = null;
        let currentCanvas = null; // 存储当前生成的图片 canvas
        let currentZoom = 1;     // 当前缩放比例

        // 显示通知
        function showToast(msg) {
            if (toasterTimer) clearTimeout(toasterTimer);
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                background: #333;
                color: #fff;
                padding: 12px 28px;
                border-radius: 8px;
                font-size: 14px;
                opacity: 0;
                transition: opacity .3s;
                pointer-events: none;
                z-index: 101;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            toasterTimer = setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        }

        // 格式化日期显示
        function formatDateDetail(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const pad = n => String(n).padStart(2, '0');
            return `${date.getFullYear()}年${pad(date.getMonth() + 1)}月${pad(date.getDate())}日 ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        // 获取当前日期字符串
        function getDateStr() {
            const date = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        }

        // HTML 转义函数
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return text.replace(/[&<>"]/g, function(m) { return map[m]; });
        }

        // 渲染便签列表
        function renderNotesList(notesToRender) {
            const leftPanel = document.getElementById('leftPanel');
            leftPanel.innerHTML = '';

            if (!notesToRender || notesToRender.length === 0) {
                leftPanel.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #999;">
                        暂无便签
                    </div>
                `;
                return;
            }

            notesToRender.forEach((note, index) => {
                const noteItem = document.createElement('div');
                noteItem.className = 'note-item';
                noteItem.dataset.id = note.id;

                const preview = note.text.split('\n')[0].substring(0, 100) || '新便签';
                const hasImage = /\.(jpg|jpeg|png|gif|svg)/i.test(note.text);

                noteItem.innerHTML = `
                    <div class="note-date">${formatDate(note.date)}</div>
                    <div class="note-preview">${escapeHtml(preview)}</div>
                    <div class="note-meta">
                        <svg class="star-icon" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        ${hasImage ? `
                            <svg class="image-icon" viewBox="0 0 24 24">
                                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                            </svg>
                        ` : ''}
                    </div>
                `;

                noteItem.addEventListener('click', function() {
                    selectNote(note);
                });

                if (index === 0 && !currentNote) {
                    noteItem.classList.add('active');
                } else if (currentNote && currentNote.id === note.id) {
                    noteItem.classList.add('active');
                }

                leftPanel.appendChild(noteItem);
            });
        }

        // 选择便签
        function selectNote(note) {
            if (isStaticMode) {
                window.location.href = `note.html?id=${encodeURIComponent(note.id)}`;
                return;
            }
            // 如果在分享模式，先退出
            exitShareMode();
            const noteItems = document.querySelectorAll('.note-item');
            noteItems.forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id === note.id) {
                    item.classList.add('active');
                }
            });
            displayNoteDetail(note);
            currentNote = note;
            isNewNote = false;
        }

        // 显示便签详情
        function displayNoteDetail(note) {
            const detailContent = document.getElementById('detailContent');
            if (!note.text.trim()) {
                detailContent.textContent = '新便签';
                detailContent.classList.add('empty');
            } else {
                detailContent.textContent = note.text;
                detailContent.classList.remove('empty');
            }
            document.getElementById('detailDate').textContent = formatDateDetail(note.date);
            detailContent.classList.remove('editing');
            isEditing = false;
        }

        // 检测是否在静态模式（GitHub Pages，无后端服务器）
        async function detectMode() {
            try {
                const resp = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });
                const ct = resp.headers.get('Content-Type') || '';
                isStaticMode = !ct.includes('json');
            } catch {
                isStaticMode = true;
            }
        }

        // 初始化加载便签
        async function initNotes() {
            await detectMode();
            if (isStaticMode) {
                document.getElementById('newBtn').style.display = 'none';
                document.getElementById('deleteBtn').style.display = 'none';
                document.getElementById('shareBtn').style.display = 'none';
            }
            try {
                const resp = await fetch('notes.json?' + Date.now());
                if (resp.ok) {
                    notes = await resp.json();
                    renderNotesList(notes);
                    if (notes.length > 0) {
                        selectNote(notes[0]);
                    } else {
                        currentNote = null;
                        document.getElementById('detailContent').textContent = '暂无便签';
                        document.getElementById('detailContent').classList.add('empty');
                        document.getElementById('detailDate').textContent = '';
                    }
                }
            } catch (e) {
                console.error('Failed to load notes:', e);
                showToast('加载便签失败');
            }
        }

        // 创建新便签
        function createNewNote() {
            exitShareMode();
            const newNote = {
                id: '',
                title: '新便签',
                date: getDateStr(),
                text: '',
                filename: ''
            };
            currentNote = newNote;
            isNewNote = true;

            document.getElementById('detailContent').textContent = '新便签';
            document.getElementById('detailContent').classList.add('empty');
            document.getElementById('detailDate').textContent = formatDateDetail(newNote.date);

            const noteItems = document.querySelectorAll('.note-item');
            noteItems.forEach(item => item.classList.remove('active'));

            setTimeout(() => {
                startEditing();
            }, 100);
        }

        // 开始编辑
        function startEditing() {
            const detailContent = document.getElementById('detailContent');
            if (!isEditing) {
                const currentText = detailContent.classList.contains('empty') ? '' : detailContent.textContent;
                const textarea = document.createElement('textarea');
                textarea.value = currentText;
                detailContent.innerHTML = '';
                detailContent.appendChild(textarea);
                detailContent.classList.remove('empty');
                detailContent.classList.add('editing');
                textarea.focus();

                textarea.addEventListener('blur', saveAndFinish);
                textarea.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (!textarea.value.trim() && isNewNote) {
                            cancelEditing();
                        } else {
                            saveAndFinish();
                        }
                    }
                });

                isEditing = true;
            }
        }

        // 取消编辑
        function cancelEditing() {
            const detailContent = document.getElementById('detailContent');
            if (currentNote && currentNote.text) {
                displayNoteDetail(currentNote);
            } else if (notes.length > 0) {
                selectNote(notes[0]);
            } else {
                currentNote = null;
                detailContent.textContent = '暂无便签';
                detailContent.classList.add('empty');
                document.getElementById('detailDate').textContent = '';
            }
            isNewNote = false;
            isEditing = false;
        }

        // 保存编辑
        async function saveAndFinish() {
            const detailContent = document.getElementById('detailContent');
            const textarea = detailContent.querySelector('textarea');
            const newText = textarea ? textarea.value : '';

            if (!newText.trim()) {
                cancelEditing();
                return;
            }

            try {
                const resp = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: newText })
                });
                const result = await resp.json();

                if (result.ok) {
                    showToast('保存成功');
                    await initNotes();

                    const savedNote = notes.find(n => n.id === result.id);
                    if (savedNote) {
                        selectNote(savedNote);
                    }
                } else {
                    showToast('保存失败: ' + result.error);
                }
            } catch (e) {
                console.error('Failed to save:', e);
                showToast('保存失败，请检查服务器是否运行');

                if (!isNewNote && currentNote) {
                    displayNoteDetail(currentNote);
                } else {
                    cancelEditing();
                }
            }
        }

        // 删除便签
        async function deleteNote() {
            if (!currentNote) {
                showToast('请先选择一个便签');
                return;
            }

            if (confirm('确定要删除这个便签吗？')) {
                try {
                    const resp = await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: currentNote.id })
                    });
                    const result = await resp.json();

                    if (result.ok) {
                        showToast('删除成功');
                        await initNotes();
                    } else {
                        showToast('删除失败: ' + result.error);
                    }
                } catch (e) {
                    console.error('Failed to delete:', e);
                    showToast('删除失败，请检查服务器是否运行');
                }
            }
        }

        // 获取站点 URL
        function getSiteUrl() {
            const loc = window.location;
            let base = loc.origin + loc.pathname;
            if (base.endsWith('/')) base = base.slice(0, -1);
            if (base.endsWith('index.html')) base = base.slice(0, -11);
            return base;
        }

        // 分享便签为图片
        async function shareNote() {
            if (!currentNote && !isNewNote) {
                showToast('请先选择一个便签');
                return;
            }

            // 如果已经在编辑中，先保存
            if (isEditing) {
                await saveAndFinish();
            }

            const detailContent = document.getElementById('detailContent');
            const text = currentNote ? currentNote.text : '';

            if (!text.trim()) {
                showToast('请先输入便签内容');
                return;
            }

            // 设置渲染卡片内容
            const dateStr = currentNote ? formatDateDetail(currentNote.date) : formatDateDetail(getDateStr());
            document.getElementById('shareDate').textContent = dateStr;
            document.getElementById('shareContent').textContent = text;

            // 生成图片
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('active');

            const canvas = await generateImage();
            loadingOverlay.classList.remove('active');
            if (!canvas) return;

            currentCanvas = canvas;
            currentZoom = 1;

            // 切换右侧面板为分享模式
            const rightPanel = document.getElementById('rightPanel');
            rightPanel.classList.add('share-mode');

            // 替换 detail-content 为图片查看器
            detailContent.innerHTML = '';
            detailContent.className = 'share-viewer';
            detailContent.classList.remove('editing', 'empty');

            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            img.draggable = false;
            detailContent.appendChild(img);

            // 更新底部栏 - 缩放控制 + 操作按钮
            const bottomBar = document.querySelector('.bottom-bar');
            bottomBar.innerHTML = `
                <button class="share-action-btn" id="backFromShareBtn">取消</button>
                <div style="margin:0 auto;display:flex;align-items:center;gap:4px;">
                    <button class="share-action-btn" id="zoomOutBtn" style="padding:6px 10px;">−</button>
                    <span class="share-zoom-level" id="zoomLevel">100%</span>
                    <button class="share-action-btn" id="zoomInBtn" style="padding:6px 10px;">+</button>
                    <button class="share-action-btn" id="zoomResetBtn">1:1</button>
                </div>
                <div style="display:flex;align-items:center;gap:4px;">
                    <button class="share-action-btn" id="openInNewBtn">打开原图</button>
                    <button class="share-action-btn" id="downloadShareBtn">下载图片</button>
                </div>
            `;

            document.getElementById('backFromShareBtn').addEventListener('click', exitShareMode);
            document.getElementById('downloadShareBtn').addEventListener('click', downloadImage);
            document.getElementById('openInNewBtn').addEventListener('click', openInNewPage);
            document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
            document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
            document.getElementById('zoomResetBtn').addEventListener('click', zoomReset);

            // 绑定图片右键菜单
            img.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                showContextMenu(e.clientX, e.clientY);
            });
        }

        // 退出分享模式，恢复右侧面板
        function exitShareMode() {
            const rightPanel = document.getElementById('rightPanel');
            if (!rightPanel.classList.contains('share-mode')) return;

            rightPanel.classList.remove('share-mode');

            const detailContent = document.getElementById('detailContent');
            detailContent.className = 'detail-content';
            detailContent.innerHTML = '';
            detailContent.classList.remove('sharing');

            // 恢复底部栏
            const bottomBar = document.querySelector('.bottom-bar');
            bottomBar.innerHTML = `
                <span style="color: #777; font-size:13px; margin-right: auto;">全部便签</span>
                <svg style="width: 16px; height: 16px; fill: #888; margin-right: 8px;" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <svg style="width: 16px; height: 16px; fill: #999;" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            `;

            // 如果当前有选中的便签，恢复显示
            if (currentNote && currentNote.text) {
                displayNoteDetail(currentNote);
            } else if (notes.length > 0) {
                selectNote(notes[0]);
            } else {
                detailContent.textContent = '暂无便签';
                detailContent.classList.add('empty');
            }

            hideContextMenu();
            currentCanvas = null;
            currentZoom = 1;
        }

        // 生成图片（带二维码）
        async function generateImage() {
            const shareCard = document.getElementById('shareCard');

            try {
                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }
                await new Promise(r => setTimeout(r, 150));

                const cardCanvas = await html2canvas(shareCard, {
                    scale: 3,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#f9f7f2',
                    logging: false
                });

                const scale = 3;
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = cardCanvas.width;

                const siteUrl = getSiteUrl();
                const noteUrl = currentNote
                    ? `${siteUrl}/note.html?id=${encodeURIComponent(currentNote.id)}`
                    : siteUrl;

                let qr = null;
                let qrModuleCount = 0;
                try {
                    qr = qrcode(0, 'M');
                    qr.addData(noteUrl);
                    qr.make();
                    qrModuleCount = qr.getModuleCount();
                } catch (e) {
                    console.warn('QR generation failed:', e);
                }

                const cellSize = 3 * scale;
                const qrSize = qrModuleCount * cellSize;
                const sectionPadding = 36 * scale;
                const qrSectionHeight = Math.ceil((sectionPadding * 2 + qrSize + 60 * scale) / scale);

                finalCanvas.height = cardCanvas.height + qrSectionHeight * scale;
                const ctx = finalCanvas.getContext('2d');

                ctx.drawImage(cardCanvas, 0, 0);

                const qrY = cardCanvas.height;
                ctx.fillStyle = '#f9f7f2';
                ctx.fillRect(0, qrY, finalCanvas.width, qrSectionHeight * scale);

                ctx.fillStyle = '#999';
                ctx.font = `${13 * scale}px -apple-system, "Segoe UI", sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('扫描二维码查看原文', finalCanvas.width / 2, qrY + 36 * scale);
                ctx.font = `${11 * scale}px -apple-system, "Segoe UI", sans-serif`;
                ctx.fillStyle = '#bbb';
                ctx.fillText(noteUrl, finalCanvas.width / 2, qrY + 60 * scale);

                if (qr) {
                    const qrYpos = qrY + 78 * scale;
                    const qrX = (finalCanvas.width - qrSize) / 2;

                    ctx.fillStyle = '#fff';
                    ctx.fillRect(qrX - 6 * scale, qrYpos - 6 * scale, qrSize + 12 * scale, qrSize + 12 * scale);
                    ctx.fillRect(qrX, qrYpos, qrSize, qrSize);

                    ctx.fillStyle = '#2c2c2c';
                    for (let row = 0; row < qrModuleCount; row++) {
                        for (let col = 0; col < qrModuleCount; col++) {
                            if (qr.isDark(row, col)) {
                                ctx.fillRect(qrX + col * cellSize, qrYpos + row * cellSize, cellSize, cellSize);
                            }
                        }
                    }
                }

                return finalCanvas;
            } catch (err) {
                console.error(err);
                showToast('图片生成失败');
                return null;
            }
        }

        // 下载图片
        async function downloadImage() {
            const canvas = currentCanvas;
            if (!canvas) return;

            const link = document.createElement('a');
            const now = new Date();
            const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
            link.download = `片语便签_${dateStr}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('图片已下载');
        }

        // 缩放控制
        function zoomIn() {
            currentZoom = Math.min(currentZoom * 1.25, 5);
            updateZoom();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom / 1.25, 0.25);
            updateZoom();
        }

        function zoomReset() {
            currentZoom = 1;
            updateZoom();
        }

        function updateZoom() {
            const img = document.querySelector('.share-viewer img');
            if (img) {
                img.style.transform = `scale(${currentZoom})`;
                img.style.transformOrigin = 'top center';
            }
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        }

        // 在新页面中打开原图
        function openInNewPage() {
            if (!currentCanvas) return;
            currentCanvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            });
        }

        // 右键菜单
        function showContextMenu(x, y) {
            const menu = document.getElementById('contextMenu');
            // 确保菜单不超出视口
            const menuWidth = 140;
            const menuHeight = 36;
            const adjustedX = Math.min(x, window.innerWidth - menuWidth - 10);
            const adjustedY = Math.min(y, window.innerHeight - menuHeight - 10);
            menu.style.left = adjustedX + 'px';
            menu.style.top = adjustedY + 'px';
            menu.classList.add('show');
        }

        function hideContextMenu() {
            document.getElementById('contextMenu').classList.remove('show');
        }

        // 查看原图（在新标签页打开）
        function viewOriginal() {
            hideContextMenu();
            if (!currentCanvas) return;
            currentCanvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            });
        }

        // 点击其他地方关闭右键菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });

        // 事件监听
        document.getElementById('refreshBtn').addEventListener('click', initNotes);
        document.getElementById('newBtn').addEventListener('click', createNewNote);
        document.getElementById('shareBtn').addEventListener('click', shareNote);
        document.getElementById('deleteBtn').addEventListener('click', deleteNote);
        document.getElementById('detailContent').addEventListener('dblclick', () => {
            if (!isEditing) startEditing();
        });
        document.getElementById('viewOriginalBtn').addEventListener('click', viewOriginal);

        // 初始化
        initNotes();
    </script>
</body>
</html>
